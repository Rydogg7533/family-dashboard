name: Sync demo branch

# Nightly: pull main's changes into demo, then (once a real demo Supabase project exists) stamp any
# table main added since the last run. See claude/stewardos-decisions-log-2026-10-24.md, "Demo for
# prospects: option B" for why this exists and how it's meant to behave.
#
# Deliberately does NOT auto-resolve a conflicting merge -- if main and demo's demo-only files
# collide, the job fails and demo stays on its last good commit until a person resolves it by hand.
# That's intentional: per the logged decision, drift should be rare (demo's only deliberate
# differences from main are the multi-tenant migration, the sign-up flow, and the seed script, none
# of which main has any reason to touch), so a conflict here is a signal worth a look, not something
# to paper over.

on:
  schedule:
    - cron: "0 9 * * *" # 2am Denver (approx; ignores DST)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0

      - name: Merge main into demo
        run: |
          git config user.name "stewardos-demo-sync"
          git config user.email "noreply@anthropic.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo "::error::main does not merge cleanly into demo -- left unresolved, demo is unchanged. Resolve by hand: git checkout demo && git merge main"
            git merge --abort
            exit 1
          fi

      - name: Push demo
        run: git push origin demo

      - name: Stamp any new tables
        if: ${{ secrets.DEMO_SUPABASE_DB_URL != '' }}
        env:
          DEMO_DB_URL: ${{ secrets.DEMO_SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          psql "$DEMO_DB_URL" -v ON_ERROR_STOP=1 -f supabase/demo/stamp_new_tables.sql

      - name: No demo database yet
        if: ${{ secrets.DEMO_SUPABASE_DB_URL == '' }}
        run: echo "DEMO_SUPABASE_DB_URL isn't set yet (no real demo project until the first tester) -- merged demo but skipped stamping."
